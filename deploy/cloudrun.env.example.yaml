# Cloud Run environment variables for the GeoFold API.
# Copy to deploy/cloudrun.env.yaml, fill the real values, and keep that file OUT of git.
# ASP.NET maps the double underscore "__" to nested config keys.

ASPNETCORE_ENVIRONMENT: "Production"

# Supabase → Settings → Database (connection pooler string). Password is secret.
ConnectionStrings__Postgres: "Host=aws-1-ap-northeast-2.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.nkqjbxlliuodbxiymatc;Password=YOUR_DB_PASSWORD;SSL Mode=Require;Trust Server Certificate=true"

# Supabase → Settings → API
Supabase__Url: "https://nkqjbxlliuodbxiymatc.supabase.co"
Supabase__ServiceRoleKey: "YOUR_SERVICE_ROLE_KEY"
Supabase__StorageBucket: "survey-photos"

# Legacy HS256 secret. Leave empty if the project uses asymmetric JWT signing keys (JWKS).
Supabase__JwtSecret: "YOUR_JWT_SECRET_OR_EMPTY"

# Any long random string. Must match what your payment provider sends on webhooks.
Webhooks__SharedSecret: "GENERATE_A_LONG_RANDOM_STRING"

# The deployed frontend origin(s) allowed to call this API (add more as __1, __2, ...).
Cors__AllowedOrigins__0: "https://your-frontend.vercel.app"
